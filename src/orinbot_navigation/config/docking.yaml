# 충전 도킹 설정 (opennav_docking).
#
# Nav2 가 목표 앞 0.7 m 지점(staging pose)까지 데려다 주면, 거기서부터는
# docking_server 가 마커를 보면서 직접 붙입니다. Nav2 의 일반 주행으로
# 벽에 붙일 수 없는 이유는 두 가지입니다.
#   - 코스트맵 팽창(0.40 m)이 벽 앞을 통째로 막아 계획 자체가 안 됩니다.
#   - SLAM 위치 오차가 중앙값 21 mm / 90% 46 mm 인데, 충전 접점은
#     그보다 작은 오차를 요구합니다. 지도 좌표가 아니라 "지금 카메라에
#     보이는 마커"를 기준으로 붙어야 합니다.
#
# 좌표계: fixed_frame 을 map 이 아니라 odom 으로 둡니다. 접근하는 몇 초
# 동안 SLAM 이 map->odom 을 수십 mm 씩 고쳐 넣는데, 그 보정이 그대로
# 목표 위치의 점프가 되어 마지막 정렬을 망칩니다. odom 은 그 사이
# 매끄럽게 이어집니다.

docking_server:
  ros__parameters:
    use_sim_time: true

    # 필수. 기본값이 false 라 그냥 두면 docking_server 가 Twist 를
    # 내보내고 diff_drive_controller(TwistStamped 구독)가 무시합니다.
    # 증상이 "도킹은 진행되는데 로봇이 제자리" 라 원인이 잘 안 보입니다.
    enable_stamped_cmd_vel: true

    controller_frequency: 50.0
    # 처음 마커를 찾는 데 주는 시간. 카메라가 15 Hz 라 기본값 5초면
    # 75 프레임인데, staging pose 도착 직후 로봇이 아직 흔들리고 있어
    # 몇 프레임은 놓칩니다. 넉넉하게 둡니다.
    initial_perception_timeout: 20.0
    dock_approach_timeout: 60.0
    wait_charge_timeout: 10.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    # Nav2 나머지 설정과 같은 프레임을 씁니다 (nav2_params.yaml 참고)
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    # 이 거리 안에 이미 서 있으면 staging 이동을 건너뜁니다
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['orinbot_dock']
    orinbot_dock:
      plugin: opennav_docking::SimpleChargingDock

      # --- 마커 기반 검출 ---
      use_external_detection_pose: true
      # 검출이 끊긴 뒤에도 마지막 값을 이만큼 더 씁니다.
      # dock_marker_board 가 0.60 m(로봇 중심)에서 자세를 확정하고 그
      # 뒤로는 같은 값을 계속 내보내므로, 여기서 "끊김"은 실제로는
      # 일어나지 않습니다. 그래도 검출기가 죽었을 때 무한정 옛 목표로
      # 밀고 들어가지 않도록 한도를 둡니다.
      external_detection_timeout: 4.0
      # 마커면 -> 도킹 완료 시 로봇 중심. 도크 x축(로봇 진행 방향)
      # 기준이라 음수입니다. 0.294 = 마커면(y=-3.894) 에서 로봇
      # 중심(y=-3.600) 까지.
      # **home_dock.pose 를 옮기면 이 값도 같이 고쳐야 합니다.**
      # 거리 편차 보정은 넣지 않습니다 — 자세를 확정하는 0.60 m 지점의
      # 편차를 tools/dock_range.py 로 재서 필요하면 여기에 더하세요.
      external_detection_translation_x: -0.294
      external_detection_translation_y: 0.0
      # ArUco 마커 좌표계 -> "x 가 도크 정면" 으로 돌리는 회전.
      # tools/dock_calib.py 로 뽑은 값입니다 (축 정렬 회전 64가지를
      # 전부 넣어 보고 도크 yaw 가 맞는 것을 고름). pitch 만 있으면 되고,
      # 이 값이 틀리면 마커는 멀쩡히 검출되는데 로봇이 도크 옆구리로
      # 파고듭니다.
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
      # 검출 저역통과 필터. **0 이 "새 측정을 그대로 쓴다"** 입니다
      # (pose_filter.hpp 주석 — 직관과 반대라 헷갈리기 쉽습니다).
      # 자세 확정 전 구간의 흔들림만 다듬으면 되므로 0.5 로 둡니다.
      filter_coef: 0.5

      # --- 붙었는지 / 충전 중인지 판정 ---
      # 목표 자세와 이만큼 안으로 들어오면 "붙었다"로 봅니다.
      # 0.05(Nav2 기본) 대신 0.03 인 이유: 자세를 확정하는 0.60 m 부터
      # 도킹 자세까지 0.31 m 를 휠 오도메트리로만 들어가는데, 그 구간의
      # 오도메트리 정확도는 mm 수준입니다. 0.05 는 이에 비해 헐거워
      # 접점이 덜 물립니다.
      # 이 값보다 battery_sim 의 contact_tolerance_lon(0.048)이 커야
      # 합니다 — 작으면 "도착했는데 충전이 안 잡히는" 교착이 납니다.
      docking_threshold: 0.03
      # **접근 종료 조건에 충전 여부를 넣지 않습니다.**
      # `docking_server` 의 접근 루프는 isDocked() 뿐 아니라
      # isCharging() 으로도 빠져나옵니다. 그런데 접점(동판)은 위치
      # 허용치가 넓어서(세로 ±48 mm, 실물 램프는 더 넓음) 목표보다
      # 한참 앞에서 "충전 시작"이 걸립니다. 그러면 접근이 거기서
      # 끝나 위치 정밀도를 잃습니다 — 실측 세로 오차 중앙값 119 mm.
      # 반대로 허용치를 좁히면 이번엔 도달했는데 충전이 안 잡혀
      # `Timed out waiting for charge to start` 로 재시도만 반복합니다
      # (실측 4회 중 3회).
      #
      # 위치 정밀도와 충전 확인을 한 조건에 묶은 것이 문제이므로
      # 역할을 나눕니다.
      #   docking_server : 확정된 목표까지 정확히 들어가는 것만 담당
      #   auto_dock.py   : /battery_state 를 보고 충전이 실제로
      #                    시작됐는지 확인하고, 안 되면 다시 도킹
      use_battery_status: false
      charging_threshold: 0.5
      # 바퀴가 멈춰선 것으로 접촉을 감지하는 방식은 쓰지 않습니다.
      # 이 로봇은 접점에 닿기 전에 멈추도록 거리를 잡아 두었습니다.
      use_stall_detection: false

      # --- 대기 위치 ---
      # 도크에서 0.7 m 뒤. Nav2 가 여기까지만 데려옵니다.
      # 벽 팽창(0.40 m) 밖이라 경로계획이 됩니다.
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0

    docks: ['home_dock']
    home_dock:
      type: orinbot_dock
      # 지도 좌표. 실기에서는 도크를 놓은 뒤 한 번 수동으로 붙여 보고
      # 그때의 base_footprint 자세를 적어 넣으면 됩니다. 어차피 최종
      # 정렬은 마커가 잡으므로 수 cm 어긋나도 무방합니다.
      frame: map
      pose: [1.0, -3.67, -1.5708]

    controller:
      # nav2_graceful_controller 의 smooth control law 를 씁니다.
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.75
      slowdown_radius: 0.25

      # 접근 구간에서는 코스트맵 충돌 검사를 끕니다
      # ==================================================================
      # 도크 앞 0.7 m 는 "벽에 일부러 부딪히러 가는" 구간입니다. 코스트맵은
      # 도크 패널과 뒷벽을 장애물로 보고 팽창(0.40 m)까지 씌우므로, 이
      # 구간의 거의 전부가 충돌로 읽힙니다. 검사를 켜 두면 도킹이
      # error_code 905(제어 실패)로 끝납니다 (실측).
      #
      # 참고로 가이드 벽이 있는 도크에서는 더 심합니다 — 로봇 내접
      # 반경(0.20 m)의 2배보다 좁은 통로는 안쪽 전체가
      # INSCRIBED_INFLATED_OBSTACLE 이 되어 원리적으로 통과 판정이
      # 나오지 않습니다.
      #
      # staging pose 까지 가는 길은 Nav2 가 자기 코스트맵으로 회피하므로,
      # 보호가 없는 구간은 마지막 0.7 m 뿐입니다.
      # **실기 배포 시 그 구간을 위한 범퍼 스위치나 모터 전류 제한 같은
      # 소프트웨어 밖의 보호 수단이 필요합니다.**
      use_collision_detection: false
      dock_collision_threshold: 0.75
      costmap_topic: /local_costmap/costmap_raw
      footprint_topic: /local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 3.0
      simulation_time_step: 0.1

# ---------------------------------------------------------------------------
# 마커 검출기 (직접 구현: scripts/dock_marker_board.py).
#
# image_proc/track_marker_node 를 쓰지 않는 이유: 그 노드는 마커 한 장만
# 추적합니다. 이 스테이션에는 가이드 벽이 없어 최종 각도를 인식이 전적으로
# 결정하는데, 한 장짜리 평면 마커는 자세 모호성으로 각도가 크게 튑니다
# (실측 1.3 m 에서 4.77도). 좌우로 벌린 3장을 하나의 보드로 풀면 그
# 흔들림이 크게 줄어듭니다.
#
# 컬러 스트림을 씁니다. VSLAM 이 이미 15 Hz 로 받고 있어 추가 렌더링
# 부담이 없습니다.
dock_marker_board:
  ros__parameters:
    use_sim_time: true
    # generate_textures.py 의 ARUCO_DICT (0 = cv2.aruco.DICT_4X4_50)
    dictionary: 0
    # generate_room.py 의 DOCK_MARKER_IDS / DOCK_MARKER_DX 와 짝입니다.
    marker_ids: [1, 0, 2]
    marker_dx: [-0.16, 0.0, 0.16]
    # 검은 사각형 한 변 [m]. 흰 여백(판 0.14 m)은 제외합니다.
    marker_size: 0.10
    min_markers: 2
    # 카메라-마커 전방 거리 [m]. 0.45 는 로봇 중심 기준 0.65 m 입니다
    # (카메라가 로봇 중심보다 0.20 m 앞).
    #
    # 왜 0.65 m 인가 (실측):
    #   0.90 m -> 거리 오차 +2.1 mm, 각도 0.06도
    #   0.70 m -> +1.4 mm, 0.00도
    #   0.60 m -> +0.8 mm, 0.01도
    #   0.50 m -> 바깥 마커가 화각을 벗어나 검출 실패
    # 정확도는 가까울수록 좋지만 0.55 m 부근에서 절벽이 있습니다.
    # 그 앞에서 여유를 두고 확정합니다.
    lock_distance: 0.45
    unlock_distance: 0.70
    fixed_frame: odom
    lock_publish_rate: 15.0

# ---------------------------------------------------------------------------
# 단계 도킹 서버 (scripts/staged_dock.py).
#
# docking_mode:=staged 일 때 opennav_docking 대신 씁니다. 액션 규격
# (/dock_robot, /undock_robot)은 같으므로 auto_dock 은 그대로입니다.
#
# 왜 단계를 끊는가: 정지 상태 인식 정확도가 각도 0.01도인데, 곡선 접근으로
# 붙이면 최종 각도 오차가 1.8도 나옵니다. 차이는 인식이 아니라 제어에서
# 생깁니다 — Nav2 의 staging 도착 허용 오차(±200 mm / ±14.3도)를 0.65 m
# 안에 다 펴야 하니 다 못 펴고 도착하기 때문입니다.
staged_dock:
  ros__parameters:
    use_sim_time: true
    dock_id: home_dock
    # dock_y 는 도킹 완료 시 로봇 중심, dock_yaw 는 **접근할 때 바라보는
    # 방향**입니다 (후진 도킹이라 최종 자세는 여기서 180도 돌아간 상태).
    dock_x: 1.0
    dock_y: -3.67
    dock_yaw: -1.5708
    # 마커면 -> 도킹 완료 자세 [m]
    dock_distance: 0.224
    # 후진 도킹. 정렬은 도크를 마주 본 채로 끝내고, 회전점에서 180도 돌아
    # 뒤로 들어갑니다. 충전 내내 카메라가 벽이 아니라 방을 봅니다.
    # 후진 도킹 — 회전점에서 180도 돌아 뒤로 들어갑니다. 충전 내내 카메라가
    # 방을 보므로 시각 오도메트리가 살아 있습니다. **아직 접촉 판정이 맞지
    # 않아 기본은 꺼 둡니다.** 켜려면 이 값과 함께 월드 생성기의
    # REVERSE_DOCK 도 true 로 바꾸고 월드를 다시 내보내야 합니다
    # (dock_y -3.67 / dock_distance 0.224 도 같이).
    reverse_dock: true
    # 마커면 -> 180도 회전 지점 [m].
    #
    # 제약은 섀시가 아니라 **캐스터입니다**. 캐스터는 x=±0.14 y=±0.14 라
    # 회전 반지름이 0.198 m 인데 구 반지름이 0.030 m 뿐이라, 높이 0.040 m 인
    # 동판 턱을 넘지 못하고 걸립니다.
    #
    # 0.70 은 검출 절벽(0.55) 위라 회전 직전에 마커로 다시 잴 수 있고,
    # 캐스터 여유가 328 mm 로 벌어집니다. 후진량은 고정이 아니라 그때 잰
    # 거리에서 dock_distance 를 뺀 값이라, 회전점 오차가 도크로 옮겨가지
    # 않습니다.
    rotate_distance: 0.50
    # 회전점 허용 오차 [m]. 0.70 m 에서 마커 거리 정확도가 ±1.4 mm 라
    # 여유가 열 배입니다.
    rotate_tolerance: 0.02
    # 마커면 -> 진입점 [m]. 여기서 멈춰 정렬합니다.
    # 0.65 인 이유: 마커 3장이 모두 보이는 한계가 0.55 m 부근이라
    # 그 앞에서 여유를 둡니다 (tools/dock_calib.py 실측).
    approach_distance: 0.65

    # 정렬 판정 — 축별로 재지 않습니다.
    # ==================================================================
    # 횡오차와 각도오차는 독립이 아닙니다. 정렬 후 직진하는 동안
    # 각도는 그대로 횡오차로 바뀝니다:
    #     접촉 시점 횡오차 = 정렬시 횡오차 - 직진거리 * sin(각도)
    # 0.52 m 직진 기준으로 0.5도가 4.5 mm, 1도가 9.1 mm, 2도가 18 mm.
    #
    # 그래서 예전 설정(횡 3 mm / 각도 0.5도)은 서로 안 맞았습니다 —
    # 허용한 각도 0.5도만으로 4.5 mm 가 생기는데 횡은 3 mm 를 맞추려고
    # 크랩을 반복했습니다 (실측: -3.1 -> +3.1 -> +0.4 mm, 회당 15~20초).
    #
    # 지금은 물리적으로 의미 있는 양 하나로 판정합니다 — 접촉 시점의
    # 예상 횡오차. 동판 접촉 허용치가 ±34 mm 이므로 그 절반을 예산으로
    # 잡습니다. 크랩 보정량도 이 값을 씁니다 (lat 이 아니라).
    # 접촉 시점의 예상 횡오차 예산 [m]. 정렬 루프가 이 값 안에 들면
    # 멈추므로, **이 값이 그대로 최종 가로 오차로 나옵니다**
    # (실측: 예상 -13.7 -> 최종 +13.2 mm / 예상 +1.2 -> 최종 -2.5 mm).
    # 크랩 기동 분해능이 3~5 mm 라 그 아래로 조이면 헛돌기만 합니다.
    contact_lateral_budget: 0.006
    # 각도 상한. 정밀도가 아니라 "측정이 이상하지 않은지" 감시용입니다.
    # 1도면 위 식으로 9 mm 라 예산 안에서 크랩이 흡수하고, 접촉 자세도
    # 포고핀 브래킷 간격(±55 mm)에 1도라 1 mm 밖에 안 틀어집니다.
    yaw_tolerance: 0.0175      # 1.0도
    max_align_iters: 4
    # 정렬 후 스테이션과 최소 여유 [m]. 후진 크랩이라 보통 저절로
    # 만족하지만, 진입이 너무 가까웠던 경우를 위한 보호입니다.
    min_standoff: 0.62

    # 크랩 기동 각도. 차동구동은 옆으로 못 가므로 횡오차를 없애려면
    # 회전 -> 직진 -> 반대회전 이 필요합니다. 30도면 횡 10 mm 에
    # 직진 20 mm 라 회전 슬립이 거의 없습니다.
    # **직진은 후진 방향입니다.** 전진으로 하면 도크 쪽으로 횡오차의
    # 1.73배(= s*cos30) 만큼 다가가서, 보정할수록 여유가 줄어듭니다
    # (실측: 횡 87 mm 보정에 154 mm 접근).
    crab_angle: 0.5236
    v_rotate: 0.35
    v_forward: 0.08
    # 목표 직전 미세 접근 속도 [m/s] 와 정지 데드밴드 [m].
    # 이 둘이 세로 오차의 하한을 정합니다 — 제어 주기가 0.02 s 이므로
    # 0.01 m/s 면 한 틱에 0.2 mm 입니다.
    # 다만 0.50 m 회전점은 검출 절벽(0.55) 아래라 회전점 자체가 마커로
    # 검증되지 않습니다. 세로를 더 줄이려면 회전점을 0.60 m 위로 올려
    # 회전 직전 측정을 살려야 합니다.
    v_creep: 0.01
    forward_tolerance: 0.0005
    settle_time: 0.7
    measure_samples: 12
    measure_timeout: 5.0
    undock_distance: 0.5
    marker_pitch: 1.5708

# ---------------------------------------------------------------------------
# 저전압 자동 복귀 + 충전 중 절전 (scripts/auto_dock.py).
auto_dock:
  ros__parameters:
    use_sim_time: true
    dock_id: home_dock
    low_soc: 0.20
    resume_soc: 0.90
    power_save: true
    # 충전 중 재울 것들. std_srvs/Empty 규격이면 무엇이든 넣을 수 있습니다.
    #
    # 실기에서는 여기에 카메라/라이다 드라이버 정지 서비스를 추가하세요.
    # 시뮬레이터에서는 Gazebo 센서를 ROS 에서 끌 수단이 없어 그대로
    # 돌아갑니다 — 그래서 시뮬 측정치로 실기 절감량을 추정할 수 없습니다.
    extra_pause_services: ['/dock_marker_board/pause']
    extra_resume_services: ['/dock_marker_board/resume']
